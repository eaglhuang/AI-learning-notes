<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>上傳文章 — AI 學習筆記</title>
  <style>
    :root {
      --primary: #4f6ef7;
      --primary-dark: #3a56d4;
      --bg: #f8f9fc;
      --card-bg: #ffffff;
      --text: #1e2235;
      --muted: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --success: #16a34a;
      --error: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #4f6ef7 0%, #7c3aed 100%);
      color: #fff;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      background: rgba(255,255,255,.2);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: background .2s;
    }
    .back-btn:hover { background: rgba(255,255,255,.35); }
    header h1 { font-size: 1.4rem; }

    main {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 24px 60px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      padding: 36px 40px;
    }

    .card h2 { font-size: 1.2rem; margin-bottom: 24px; color: var(--text); }

    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    label .optional { font-weight: 400; color: var(--muted); margin-left: 4px; }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .95rem;
      color: var(--text);
      background: #fff;
      transition: border-color .2s;
      font-family: inherit;
      outline: none;
    }
    input[type="text"]:focus,
    textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 36px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--primary);
      background: #eef2ff;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
    }
    .dz-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .dz-text { color: var(--muted); font-size: .92rem; line-height: 1.6; }
    .dz-text strong { color: var(--primary); }
    .dz-filename {
      margin-top: 12px;
      padding: 8px 16px;
      background: #eef2ff;
      border-radius: 6px;
      font-size: .88rem;
      color: var(--primary);
      font-weight: 600;
      display: none;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, opacity .2s;
      margin-top: 8px;
    }
    .submit-btn:hover:not(:disabled) { background: var(--primary-dark); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    /* Progress */
    #progress-wrap {
      display: none;
      margin-top: 16px;
    }
    .progress-bar-bg {
      background: var(--border);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 20px;
      width: 0%;
      transition: width .3s;
    }
    .progress-label {
      font-size: .82rem;
      color: var(--muted);
      margin-top: 6px;
      text-align: right;
    }

    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: .92rem;
      margin-top: 16px;
      display: none;
    }
    .alert.success { background: #dcfce7; color: var(--success); }
    .alert.error   { background: #fee2e2; color: var(--error); }
    .alert a { color: inherit; font-weight: 700; }
  </style>
</head>
<body>

<header>
  <a href="/" class="back-btn" aria-label="返回首頁">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
  </a>
  <h1>上傳技術文章</h1>
</header>

<main>
  <div class="card">
    <h2>📤 新增文章</h2>
    <form id="upload-form">
      <div class="form-group">
        <label for="title">文章標題 <span class="optional">（選填，預設為檔名）</span></label>
        <input type="text" id="title" name="title" placeholder="例：GPT 原理詳解" maxlength="200" />
      </div>

      <div class="form-group">
        <label for="description">文章簡介 <span class="optional">（選填）</span></label>
        <textarea id="description" name="description" placeholder="簡短描述這篇文章的內容..." maxlength="500"></textarea>
      </div>

      <div class="form-group">
        <label>HTML 文章檔案</label>
        <div class="drop-zone" id="drop-zone">
          <input type="file" id="file-input" name="article" accept=".html" required />
          <div class="dz-icon">📄</div>
          <div class="dz-text">
            <strong>點擊選擇</strong> 或拖曳 HTML 檔案至此<br/>
            <small>僅支援 .html 格式，最大 10 MB</small>
          </div>
          <div class="dz-filename" id="dz-filename"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">上傳文章</button>

      <div id="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">0%</div>
      </div>

      <div class="alert" id="alert"></div>
    </form>
  </div>
</main>

<script>
  const dropZone   = document.getElementById('drop-zone')
  const fileInput  = document.getElementById('file-input')
  const dzFilename = document.getElementById('dz-filename')
  const form       = document.getElementById('upload-form')
  const submitBtn  = document.getElementById('submit-btn')
  const alertBox   = document.getElementById('alert')
  const progressWrap = document.getElementById('progress-wrap')
  const progressFill = document.getElementById('progress-fill')
  const progressLabel = document.getElementById('progress-label')

  // Drag-and-drop styling
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over') })
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'))
  dropZone.addEventListener('drop', e => {
    e.preventDefault()
    dropZone.classList.remove('drag-over')
    const files = e.dataTransfer.files
    if (files.length) {
      fileInput.files = files
      updateFilename(files[0].name)
    }
  })

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) updateFilename(fileInput.files[0].name)
  })

  function updateFilename (name) {
    dzFilename.textContent = '✅ 已選擇：' + name
    dzFilename.style.display = 'block'
  }

  function showAlert (msg, type, link) {
    alertBox.className = 'alert ' + type
    alertBox.style.display = 'block'
    alertBox.innerHTML = link
      ? `${escHtml(msg)} <a href="${link}">前往閱讀 →</a>`
      : escHtml(msg)
  }

  function escHtml (str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  form.addEventListener('submit', async e => {
    e.preventDefault()
    alertBox.style.display = 'none'

    const file = fileInput.files[0]
    if (!file) { showAlert('請選擇 HTML 檔案', 'error'); return }

    const formData = new FormData(form)

    submitBtn.disabled = true
    submitBtn.textContent = '上傳中...'
    progressWrap.style.display = 'block'
    progressFill.style.width = '0%'
    progressLabel.textContent = '0%'

    try {
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest()
        xhr.open('POST', '/api/articles')

        xhr.upload.addEventListener('progress', ev => {
          if (ev.lengthComputable) {
            const pct = Math.round((ev.loaded / ev.total) * 100)
            progressFill.style.width = pct + '%'
            progressLabel.textContent = pct + '%'
          }
        })

        xhr.addEventListener('load', () => {
          if (xhr.status === 201) {
            const data = JSON.parse(xhr.responseText)
            resolve(data)
          } else {
            let msg = '上傳失敗'
            try { msg = JSON.parse(xhr.responseText).error || msg } catch {}
            reject(new Error(msg))
          }
        })
        xhr.addEventListener('error', () => reject(new Error('網路錯誤，請稍後再試')))
        xhr.send(formData)
      }).then(data => {
        showAlert('文章上傳成功！', 'success', `article.html?id=${encodeURIComponent(data.id)}`)
        form.reset()
        dzFilename.style.display = 'none'
      })
    } catch (err) {
      showAlert(err.message, 'error')
    } finally {
      submitBtn.disabled = false
      submitBtn.textContent = '上傳文章'
      progressWrap.style.display = 'none'
    }
  })
</script>
</body>
</html>
