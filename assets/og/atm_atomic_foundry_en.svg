  <line x1="112" y1="540" x2="1088" y2="540" stroke="#19242f" stroke-opacity="0.12" stroke-width="1"/>
  <text x="112" y="566" font-family="'Aptos','IBM Plex Sans',sans-serif"
        font-size="20" font-weight="700" fill="#16222d">
